    <script>
      // Runs before first paint: saved dark theme, and the `js` class that enables scroll reveals.
      (function () {
        var h = document.documentElement;
        h.classList.add('js');
        try {
          if (localStorage.getItem('loopa-theme-choice') === 'dark') h.classList.add('dark');
        } catch (e) {}
      })();
    </script>
